{% extends "allauth/layouts/base.html" %}
{% load allauth account %}
{% load static %}

{% block body %}
  <div class="flex min-h-screen bg-[#000] text-gray-100">
    <div class="flex-1 flex flex-col justify-center lg:pb-40 items-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <img src="{% static 'img/mytrackz-logo.svg' %}"
               alt="MyTrackz"
               class="w-full h-auto mb-8 rounded-lg bg-[#2a2f35]">

          <p class="text-gray-400 text-[25px]">
            {% block content_title %}
            {% endblock content_title %}
          </p>

        </div>
        <div class="bg-[#2a2f35] rounded-lg p-8 shadow-lg">
          {% block content %}
          {% endblock content %}
        </div>
      </div>
    </div>
  </div>

{% endblock body %}
