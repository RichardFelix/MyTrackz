{% load app_tags %}

<div class="bg-[#2a2f35] p-6 rounded-lg max-h-[85svh] overflow-y-auto"
     x-data="{ url: '{{ item.image|escapejs }}' }">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-white">Change Image</h2>
    <button class="text-gray-400 hover:text-white cursor-pointer"
            @click="imageOpen = false">{% include "app/icons/x.svg" with classes="w-6 h-6" %}</button>
  </div>

  <form method="post"
        action="{% media_view_url 'image_save' item %}?next={{ return_url|urlencode }}">
    {% csrf_token %}

    <div class="flex justify-center mb-4">
      <img alt="Image preview"
           class="max-h-64 rounded-lg shadow-lg bg-[#39404b] object-cover"
           :src="url || '{{ item.cached_image_url|escapejs }}'">
    </div>

    <label class="block text-sm font-medium text-gray-300 mb-1" for="id_image">Image URL</label>
    <input id="id_image"
           name="image"
           type="url"
           required
           x-model="url"
           placeholder="https://example.com/poster.jpg"
           class="w-full rounded-md bg-[#39404b] border border-gray-600 text-white px-3 py-2 mb-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <p class="text-xs text-gray-400 mb-4">The image is downloaded and served locally. It changes the poster everywhere, for every user.</p>

    <div class="flex items-center gap-3">
      <button type="submit"
              class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition duration-300 cursor-pointer">
        Save
      </button>

      {% if can_revert %}
        <button type="submit"
                name="operation"
                value="revert"
                formnovalidate
                title="Restore the provider's original image"
                class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition duration-300 cursor-pointer">
          Revert to original
        </button>
      {% endif %}
    </div>
  </form>
</div>
