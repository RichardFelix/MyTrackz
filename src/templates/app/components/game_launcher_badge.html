{% if media and item.media_type == MediaTypes.GAME.value %}
  <div data-game-launcher-badge
       {% if compact %}style="right: 0.25rem; top: 0.25rem;"{% endif %}
       class="pointer-events-none absolute z-0 rounded-md bg-black/80 px-1.5 py-1.5 text-xs font-medium whitespace-nowrap text-white shadow-md ring-1 ring-white/15 {% if not compact %}game-launcher-badge-responsive right-2 top-2{% endif %}">
    {{ media.get_launcher_display }}
  </div>
{% endif %}
