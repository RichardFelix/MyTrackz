{# Self-replacing poll: re-fetches the feed until the build finishes, at which #}
{# point the swapped-in feed HTML carries no trigger and polling stops. #}
<div hx-get="{% url 'discover_recommendations' %}"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML">
  <div class="flex flex-col items-center justify-center py-16 space-y-4">
    <div class="h-8 w-8 animate-spin rounded-full border-b-2 border-indigo-400"></div>
    <p class="text-sm text-gray-400">Building your recommendations…</p>
  </div>
</div>
